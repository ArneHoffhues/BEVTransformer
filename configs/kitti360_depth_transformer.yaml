model:
  base_learning_rate: 4.5e-06
  target: bev.model.model.DepthAndSegTransformer
  params:
    n_labels: 10
    n_embed: 512
    class_names: ['road', 'sidewalk', 'building', 'wall', 'vegetation', 'terrain', 'person',
                  'rider', 'car', 'truck']
    colorize: [[255, 0, 255],
               [75, 0, 75],
               [255, 200, 0],
               [255, 120, 50],
               [0, 175, 0],
               [150, 240, 80],
               [255, 30, 30],
               [100, 230, 245],
               [100, 150, 245],
               [80, 30, 180],
               [0, 0, 0]]
    ignore_index: 255
    sfsegnet_config:
      target: bev.model.sfsegnet.sfnet_resnet.DeepR18_SF_deeply_dsn
      params:
        num_classes: 19
        snapshot: SFSegNet/sfnet_r18_map.pth
    depth_module_config:
      target: bev.model.depth_projection.depth_module.GridAssembler
      params:
        grid_dim: [50, 50]
        z_range: [51, 1]
        x_range: [-25, 25]
        num_pix: 304128
        max_num_pix_per_cell: 1000
        with_density: True
        num_dim: 256
    transformer_config:
      target: bev.model.transformer.SegAndDensityTransformer
      params:
        n_embed: 256
        n_head: 8
        num_layers: 6
        dim_feedforward: 1024
        bev_grid_size: [50, 50]
        density_grid_size: [200, 200]
        neighbourhood_size: 5
    pos_encoding_config:
      target: bev.model.pos_encoding.PositionEmbeddingSine
      params:
        num_pos_feats: 128
    density_pos_encoding_config:
      target: bev.model.pos_encoding.PositionEmbeddingSine
      params:
        num_pos_feats: 128
    decoder_config:
      target: bev.model.decoder.SegAndDensityDecoder
      params:
        in_channels: 256
        num_classes: 10
        predict_vis: True
        final_res: [676, 676]
    loss_config:
      target: bev.model.loss.CombinedLoss
      params:
        extrinsics:
          translation: [0.8, 0.3, 1.55]
          rotation: [-85, 0, 180]
        background_classes: [2, 3, 4, 5]
        foreground_classes: [0, 1, 6, 7, 8, 9]
        out_shape: [676, 676]
        resolution: 0.074
        priors: kitti360

data:
  target: bev.data.data_module.DataModuleFromConfig
  params:
    batch_size: 3
    num_workers: 4
    dataset: kitti360
    with_depth: True
    train:
      target: bev.data.kitti360_bev.KITTI360BEVTrain
      params:
        n_labels: 10
        preprocess_param:
          rgb_size: [288, 1056]
          bev_size: [676, 676]
          bottom_crop_augmentation_prob: 0.
          side_crop_augmentation_prob: 0.
          rotate_augmentation_prob: 0.
          brightness_factor: 0.
          contrast_factor: 0.
    validation:
      target: bev.data.kitti360_bev.KITTI360BEVValidation
      params:
        n_labels: 10
        preprocess_param:
          rgb_size: [288, 1056]
          bev_size: [676, 676]
          bottom_crop_augmentation_prob: 0.
          side_crop_augmentation_prob: 0.
          rotate_augmentation_prob: 0.
          flip_prob: 0.
          brightness_factor: 0
          contrast_factor: 0
