model:
  base_learning_rate: 4.5e-06
  target: bev.model.model.DepthAndSegTransformer
  params:
    n_labels: 9
    n_embed: 512
    class_names: ['road', 'sidewalk', 'manmade', 'vegetation', 'terrain', 'person',
                  'car', 'truck', 'rider']
    colorize: [[255, 0, 255],
               [75, 0, 75],
               [70, 70, 70],
               [0, 175, 0],
               [150, 240, 80],
               [255, 30, 30],
               [100, 150, 245],
               [80, 30, 180],
               [100, 230, 245],
               [0, 0, 0]]
    ignore_index: 255
    sfsegnet_config:
      target: bev.model.sfsegnet.sfnet_resnet.DeepR18_SF_deeply_dsn
      params:
        num_classes: 19
        snapshot: SFSegNet/sfnet_r18_map.pth
    depth_module_config:
      target: bev.model.depth_projection.depth_module.GridAssembler
      params:
        grid_dim: [50, 50]
        z_range: [51, 1]
        x_range: [-25, 25]
        num_pix: 344064
        max_num_pix_per_cell: 1000
        with_density: True
        num_dim: 256
    transformer_config:
      target: bev.model.transformer.SegAndDensityTransformer
      params:
        n_embed: 256
        n_head: 8
        num_layers: 6
        dim_feedforward: 1024
        bev_grid_size: [50, 50]
        density_grid_size: [200, 200]
        neighbourhood_size: 5
    pos_encoding_config:
      target: bev.model.pos_encoding.PositionEmbeddingSine
      params:
        num_pos_feats: 128
    density_pos_encoding_config:
      target: bev.model.pos_encoding.PositionEmbeddingSine
      params:
        num_pos_feats: 128
    decoder_config:
      target: bev.model.decoder.SegAndDensityDecoder
      params:
        in_channels: 256
        num_classes: 9
        predict_vis: True
        final_res: [650, 650]
    loss_config:
      target: bev.model.loss.CombinedLoss
      params:
        extrinsics:
          translation: [0.8, 0.3, 1.55]
          rotation: [-85, 0, 180]
        background_classes: [2, 3, 4]
        foreground_classes: [0, 1, 5, 6, 7, 8]
        out_shape: [650, 650]
        resolution: 0.077
        priors: nuscenes

data:
  target: bev.data.data_module.DataModuleFromConfig
  params:
    batch_size: 3
    num_workers: 8
    dataset: nuscenes_bev
    with_depth: True
    train:
      target: bev.data.nuscenes_bev.NuScenesBEVTrain
      params:
        n_labels: 9
        preprocess_param:
          rgb_size: [448, 768]
          bev_size: [650, 650]
          brightness_factor: 0
          contrast_factor: 0
    validation:
      target: bev.data.nuscenes_bev.NuScenesBEVValidation
      params:
        n_labels: 9
        preprocess_param:
          rgb_size: [448, 768]
          bev_size: [650, 650]
          flip_prob: 0.
          brightness_factor: 0
          contrast_factor: 0

