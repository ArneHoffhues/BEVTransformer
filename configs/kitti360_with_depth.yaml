model:
  base_learning_rate: 4.5e-06
  target: bev.model.model.DepthAndSegUpsampler
  params:
    n_labels: 10
    n_embed: 512
    class_names: ['road', 'sidewalk', 'building', 'wall', 'vegetation', 'terrain', 'person',
                  'rider', 'car', 'truck']
    colorize: [[255, 0, 255],
               [75, 0, 75],
               [255, 200, 0],
               [255, 120, 50],
               [0, 175, 0],
               [150, 240, 80],
               [255, 30, 30],
               [100, 230, 245],
               [100, 150, 245],
               [80, 30, 180],
               [0, 0, 0]]
    ignore_index: 255
    sfsegnet_config:
      target: bev.model.sfsegnet.sfnet_resnet.DeepR18_SF_deeply_dsn
      params:
        num_classes: 19
        snapshot: SFSegNet/sfnet_r18_map.pth
    depth_module_config:
      target: bev.model.depth_projection.depth_module.GridAssembler
      params:
        grid_dim: [50, 50]
        z_range: [51, 1]
        x_range: [-25, 25]
        num_pix: 540672
    decoder_config:
      target: bev.model.decoder.Decoder
      params:
        in_channels: 512
        num_classes: 10
        layers: [6, 1, 1]
        strides: [1, 2, 2]
    loss_config:
      target: bev.model.loss.CELoss

data:
  target: bev.data.data_module.DataModuleFromConfig
  params:
    batch_size: 2
    num_workers: 2
    dataset: kitti360
    with_depth: True
    train:
      target: bev.data.kitti360_bev.KITTI360BEVTrain
      params:
        n_labels: 10
        preprocess_param:
          crop_region: [46, 14, 722, 690]
          flip_prob: 0.5
          rgb_size: [384, 1408]
          bev_size: [200, 200]
          brightness_factor: 0
          contrast_factor: 0
          saturation_factor: 0
          hue_factor: 0
    validation:
      target: bev.data.kitti360_bev.KITTI360BEVValidation
      params:
        n_labels: 10
        preprocess_param:
          crop_region: [46, 14, 722, 690]
          flip_prob: 0.
          rgb_size: [384, 1408]
          bev_size: [200, 200]
          brightness_factor: 0
          contrast_factor: 0
          saturation_factor: 0
          hue_factor: 0
