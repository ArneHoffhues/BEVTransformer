model:
  base_learning_rate: 4.5e-06
  target: bev.model.model.BEVTransformer
  params:
    n_labels: 14
    n_embed: 256
    class_names: ['drivable_area', 'ped_crossing', 'walkway', 'carpark', 'car', 'truck', 
                'bus', 'trailer', 'construction_vehicle', 'pedestrian', 'motorcycle', 
                'bicycle', 'traffic_cone', 'barrier']
    colorize:  [[255, 0, 255],
                [150, 255, 170],
                [75, 0, 75],
                [255, 150, 255],
                [100, 150, 245],
                [80, 30, 180],
                [100, 80, 250],
                [175, 0, 75],
                [70, 70, 70],
                [255, 30, 30],
                [150, 30, 90],
                [100, 230, 245],
                [255, 200, 0],
                [255, 120, 50]
                ]
    transformer_config:
      target: bev.model.transformer.SamplingTransformer
      params:
        bev_grid_size: [49, 50]
        grid_cell_width: 1
        vertical_sampling_range: [-3, 3]
        n_samples_vertical: 20
        n_samples_ray: 50
        neighbourhood_size: 7
        initialization_level: -0.5
        n_embed: 256
        n_head: 8
        num_layers: 6
        dim_feedforward: 1024
        normalize_before: False
        activation: 'relu'
    pos_encoding_config:
      target: bev.model.pos_encoding.PositionEmbeddingSine
      params:
        num_pos_feats: 128
    height_pos_encoding_config:
      target: bev.model.pos_encoding.PositionEmbeddingSineHeight
      params:
        num_pos_feats: 256
    backbone_config:
      target: bev.model.backbone.swin.SwinFPN
      params:      
        variant: 'tiny'
        pretrained_path: /home/hoffhues/master_repositories/BEVTransformer/pretrained/mask_rcnn_swin_tiny_patch4_window7.pth
    net3d_config:
      target: bev.model.3d_feature_extractor.Net3D
      params:
        scales: [4, 8, 16, 32, 64]
        in_ch: 256
        out_ch: 256
        n_classes: 14
        bev_grid_size: [49, 50]
        grid_cell_width: 1
        vertical_sampling_range: [-3, 3]
        n_samples: 20
        initialization_level: -0.5
    decoder_config:
      target: bev.model.decoder.Decoder
      params:
        in_channels: 256
        num_classes: 14
        layers: [6, 4, 4]
        strides: [1, 2, 2]
    loss_config:
      target: bev.model.loss.BCELoss

data:
  target: bev.data.data_module.NuscenesDataModuleFromConfig
  params:
    nuscenes_path: /globalwork/data/nuScenes-v1.0
    nuscenes_version: v1.0-trainval
    batch_size: 2
    num_workers: 4
    train:
      target: bev.data.nuscenes_original.NuscenesSegmentationTrain
      params:
        n_labels: 14
        label_path: /globalwork/hoffhues/mono-semantic-maps_labels/nuscenes/map-labels-v1.2
        dataset_size: 50000
        preprocess_param:
          crop_region: [0, 0, 200, 196]
          flip_prob: 0.5
          rgb_size: [600, 800]
          bev_size: [196, 200]
    validation:
      target: bev.data.nuscenes_original.NuscenesSegmentationValidation
      params:
        label_path: /globalwork/hoffhues/mono-semantic-maps_labels/nuscenes/map-labels-v1.2
        n_labels: 14
        preprocess_param:
          crop_region: [0, 0, 200, 196]
          flip_prob: 0.0
          rgb_size: [600, 800]
          bev_size: [196, 200]
